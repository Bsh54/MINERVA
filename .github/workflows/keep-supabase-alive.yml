name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 8 */3 * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping Supabase REST API
        run: |
          echo "Pinging Supabase at $(date -u)..."

          HTTP_CODE=$(curl -s -o /tmp/supabase_response.txt -w "%{http_code}" \
            --max-time 30 \
            "https://prywwsueggmolcfhrvll.supabase.co/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")

          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $(cat /tmp/supabase_response.txt)"

          if [ "$HTTP_CODE" -ge 200 ] 2>/dev/null; then
            echo "Supabase is alive (status $HTTP_CODE)"
          else
            echo "Unreachable (status: $HTTP_CODE)"
            exit 1
          fi
